<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; margin: 0; padding: 16px; background: #f4f6f8; color: #1d2733; font-size: 16px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .card { background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  label { display: block; font-weight: 600; margin: 14px 0 6px; font-size: 15px; }
  select, input, textarea { width: 100%; font-size: 16px; padding: 12px; border: 1px solid #cfd6de; border-radius: 8px; background: #fff; }
  .types { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .types button { padding: 12px 0; font-size: 15px; border: 1px solid #cfd6de; border-radius: 8px; background: #fff; }
  .types button.on { background: #1f6feb; color: #fff; border-color: #1f6feb; font-weight: 700; }
  .hint { font-size: 13px; color: #5b6b7b; margin-top: 4px; }
  .submit { width: 100%; margin-top: 20px; padding: 14px; font-size: 17px; font-weight: 700; border: 0; border-radius: 10px; background: #1f6feb; color: #fff; }
  .submit:disabled { background: #9db8e6; }
  .msg { margin-top: 14px; padding: 12px; border-radius: 8px; display: none; }
  .msg.ok { display: block; background: #e3f6e8; color: #17692e; }
  .msg.err { display: block; background: #fde8e8; color: #a32020; }
  .hide { display: none; }
</style>
</head>
<body>
  <h1>🦷 牙材進出登記</h1>
  <div class="card">
    <label>異動類型</label>
    <div class="types" id="types">
      <button type="button" data-t="進貨">進貨</button>
      <button type="button" data-t="領用" class="on">領用</button>
      <button type="button" data-t="報廢">報廢</button>
      <button type="button" data-t="盤點調整">盤點</button>
    </div>

    <label for="item">材料</label>
    <select id="item"><option value="">載入中…</option></select>
    <div class="hint" id="stockHint"></div>

    <div id="newBatch" class="hide">
      <label for="batchIn">批號</label>
      <input id="batchIn" placeholder="外盒上的 LOT 號碼">
      <label for="expiry">效期</label>
      <input id="expiry" type="date">
    </div>

    <div id="pickBatch">
      <label for="batchSel">批號</label>
      <select id="batchSel"></select>
      <div class="hint">已依效期排序，請先用最早到期的批號</div>
    </div>

    <label for="qty">數量 <span id="unit"></span></label>
    <input id="qty" type="number" inputmode="decimal" step="any">
    <div class="hint hide" id="adjHint">盤點比帳上少請填負數（例：-2），多請填正數</div>

    <label for="staff">經手人</label>
    <select id="staff"></select>

    <label for="date">異動日期</label>
    <input id="date" type="date">

    <label for="note">備註（選填）</label>
    <textarea id="note" rows="2"></textarea>

    <button class="submit" id="submit">送出登記</button>
    <div class="msg" id="msg"></div>
  </div>

<script>
  let data = { items: [], staff: [], batches: {} };
  let type = '領用';
  const $ = id => document.getElementById(id);

  function today() {
    const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0, 10);
  }

  function load() {
    google.script.run.withSuccessHandler(d => {
      data = d;
      const keep = $('item').value;
      $('item').innerHTML = '<option value="">請選擇材料</option>' +
        d.items.map(i => `<option value="${i.id}">${i.id}｜${i.name}</option>`).join('');
      $('item').value = keep;
      let last = '';
      try { last = localStorage.getItem('staff') || ''; } catch (e) {}
      $('staff').innerHTML = '<option value="">請選擇</option>' +
        d.staff.map(s => `<option>${s}</option>`).join('');
      if (d.staff.includes(last)) $('staff').value = last;
      refresh();
    }).withFailureHandler(showErr).getFormData();
  }

  function refresh() {
    const item = data.items.find(i => i.id === $('item').value);
    $('unit').textContent = item ? `（${item.unit}）` : '';
    $('stockHint').textContent = item ? `目前庫存：${item.stock} ${item.unit}` : '';
    const isIn = type === '進貨';
    $('newBatch').classList.toggle('hide', !isIn);
    $('pickBatch').classList.toggle('hide', isIn);
    $('adjHint').classList.toggle('hide', type !== '盤點調整');
    const list = item ? (data.batches[item.id] || []) : [];
    $('batchSel').innerHTML = list.length
      ? list.map(b => `<option value="${b.batch}">${b.batch}｜效期 ${b.expiry}｜剩 ${b.remaining}</option>`).join('')
      : '<option value="">（沒有在庫批號）</option>';
  }

  function showErr(e) {
    $('msg').className = 'msg err';
    $('msg').textContent = '❌ ' + (e.message || e);
    $('submit').disabled = false;
  }

  $('types').addEventListener('click', e => {
    if (!e.target.dataset.t) return;
    type = e.target.dataset.t;
    [...$('types').children].forEach(b => b.classList.toggle('on', b === e.target));
    refresh();
  });
  $('item').addEventListener('change', refresh);

  $('submit').addEventListener('click', () => {
    $('submit').disabled = true;
    $('msg').className = 'msg';
    const payload = {
      type, id: $('item').value, qty: $('qty').value, staff: $('staff').value,
      date: $('date').value, note: $('note').value.trim(),
      batch: type === '進貨' ? $('batchIn').value.trim() : $('batchSel').value,
      expiry: $('expiry').value,
    };
    try { localStorage.setItem('staff', payload.staff); } catch (e) {}
    google.script.run.withSuccessHandler(m => {
      $('msg').className = 'msg ok';
      $('msg').textContent = '✅ ' + m;
      $('qty').value = ''; $('note').value = ''; $('batchIn').value = ''; $('expiry').value = '';
      $('submit').disabled = false;
      load();
    }).withFailureHandler(showErr).submitEntry(payload);
  });

  $('date').value = today();
  load();
</script>
</body>
</html>
